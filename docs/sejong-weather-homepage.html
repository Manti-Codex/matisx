<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>세종시 날씨</title>
  <style>
    :root {
      --bg-top: #103c58;
      --bg-bottom: #f4eee3;
      --panel: rgba(255, 255, 255, 0.86);
      --text: #0f2432;
      --accent: #ef6b2e;
      --muted: #5d6d78;
      --ok: #2f8f83;
      --shadow: 0 18px 40px rgba(16, 46, 65, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.22), transparent 42%),
        radial-gradient(circle at 80% 0%, rgba(239, 107, 46, 0.22), transparent 36%),
        linear-gradient(165deg, var(--bg-top), var(--bg-bottom));
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .wrap {
      width: min(980px, 100%);
      background: var(--panel);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .hero {
      padding: 28px 28px 12px;
      color: #f8fafc;
      background:
        linear-gradient(145deg, rgba(16, 60, 88, 0.95), rgba(47, 143, 131, 0.9)),
        linear-gradient(90deg, #0d2f46, #1d6a60);
    }

    .city {
      font-size: clamp(1.5rem, 3.5vw, 2.3rem);
      font-weight: 800;
      letter-spacing: 0.01em;
      margin: 0 0 6px;
    }

    .updated {
      margin: 0;
      color: rgba(248, 250, 252, 0.86);
      font-size: 0.95rem;
    }

    .main {
      padding: 20px 24px 28px;
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(16, 46, 65, 0.08);
    }

    .big {
      grid-column: 1 / -1;
      display: grid;
      gap: 14px;
      grid-template-columns: 1.3fr 1fr;
      align-items: center;
      background: linear-gradient(125deg, rgba(239, 107, 46, 0.1), rgba(47, 143, 131, 0.1));
    }

    .temp {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 900;
      margin: 0;
      line-height: 1;
      color: var(--accent);
    }

    .summary {
      margin: 8px 0 0;
      font-size: 1.02rem;
      color: var(--muted);
    }

    .label {
      margin: 0 0 10px;
      font-size: 0.88rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
    }

    .metric {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 800;
      color: #15384f;
    }

    .forecast {
      grid-column: 1 / -1;
    }

    .forecast-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }

    .forecast-item {
      border: 1px solid rgba(16, 46, 65, 0.08);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      background: #fff;
    }

    .time {
      margin: 0;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .t {
      margin: 4px 0 0;
      font-weight: 800;
      color: #123046;
    }

    .status {
      color: var(--ok);
      font-weight: 700;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .error {
      color: #aa1e2c;
      font-weight: 700;
      margin: 0;
    }

    @media (max-width: 760px) {
      .main {
        grid-template-columns: 1fr 1fr;
      }
      .big {
        grid-template-columns: 1fr;
      }
      .forecast-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <h1 class="city">세종특별자치시 날씨</h1>
      <p class="updated" id="updated">날씨 정보 로딩 중...</p>
    </header>

    <section class="main">
      <article class="card big">
        <div>
          <p class="label">현재 기온</p>
          <p class="temp" id="temp">--°C</p>
          <p class="summary" id="weatherDesc">데이터를 불러오는 중입니다.</p>
          <p class="status" id="status"></p>
        </div>
        <div>
          <p class="label">체감 + 강수확률</p>
          <p class="metric" id="feelsLike">--°C / --%</p>
        </div>
      </article>

      <article class="card">
        <p class="label">습도</p>
        <p class="metric" id="humidity">--%</p>
      </article>

      <article class="card">
        <p class="label">풍속</p>
        <p class="metric" id="wind">-- km/h</p>
      </article>

      <article class="card">
        <p class="label">일출/일몰</p>
        <p class="metric" id="sun">--:-- / --:--</p>
      </article>

      <article class="card forecast">
        <p class="label">앞으로 18시간 (3시간 간격)</p>
        <ul class="forecast-list" id="forecastList"></ul>
      </article>
    </section>
  </main>

  <script>
    const LAT = 36.4800;
    const LON = 127.2890;

    const weatherCodeToText = (code) => {
      const map = {
        0: "맑음",
        1: "대체로 맑음",
        2: "부분적으로 흐림",
        3: "흐림",
        45: "안개",
        48: "서리 안개",
        51: "가벼운 이슬비",
        53: "이슬비",
        55: "강한 이슬비",
        61: "약한 비",
        63: "비",
        65: "강한 비",
        71: "약한 눈",
        73: "눈",
        75: "강한 눈",
        80: "약한 소나기",
        81: "소나기",
        82: "강한 소나기",
        95: "뇌우"
      };
      return map[code] || "날씨 정보";
    };

    const trimTime = (iso) => {
      if (!iso) return "--:--";
      return iso.split("T")[1]?.slice(0, 5) || "--:--";
    };

    const updatedEl = document.getElementById("updated");
    const statusEl = document.getElementById("status");

    async function loadWeather() {
      const url = "https://api.open-meteo.com/v1/forecast"
        + "?latitude=" + LAT
        + "&longitude=" + LON
        + "&timezone=Asia%2FSeoul"
        + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m"
        + "&hourly=temperature_2m,precipitation_probability"
        + "&daily=sunrise,sunset";

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        const current = data.current;
        const hourly = data.hourly;
        const daily = data.daily;

        document.getElementById("temp").textContent = `${Math.round(current.temperature_2m)}°C`;
        document.getElementById("weatherDesc").textContent = weatherCodeToText(current.weather_code);
        document.getElementById("humidity").textContent = `${Math.round(current.relative_humidity_2m)}%`;
        document.getElementById("wind").textContent = `${Math.round(current.wind_speed_10m)} km/h`;
        document.getElementById("feelsLike").textContent =
          `${Math.round(current.apparent_temperature)}°C / ${Math.round(hourly.precipitation_probability[0] ?? 0)}%`;
        document.getElementById("sun").textContent =
          `${trimTime(daily.sunrise?.[0])} / ${trimTime(daily.sunset?.[0])}`;

        const now = new Date();
        updatedEl.textContent = `업데이트: ${now.toLocaleString("ko-KR", { timeZone: "Asia/Seoul" })}`;
        statusEl.textContent = "실시간 예보 반영 완료";

        const list = document.getElementById("forecastList");
        list.innerHTML = "";

        for (let i = 0; i < 6; i += 1) {
          const idx = i * 3;
          const li = document.createElement("li");
          li.className = "forecast-item";
          li.innerHTML = `
            <p class="time">${trimTime(hourly.time[idx])}</p>
            <p class="t">${Math.round(hourly.temperature_2m[idx])}°C</p>
          `;
          list.appendChild(li);
        }
      } catch (err) {
        updatedEl.textContent = "업데이트 실패";
        statusEl.className = "error";
        statusEl.textContent = "날씨 데이터를 불러오지 못했습니다. 네트워크를 확인하세요.";
        console.error(err);
      }
    }

    loadWeather();
    setInterval(loadWeather, 10 * 60 * 1000);
  </script>
</body>
</html>
